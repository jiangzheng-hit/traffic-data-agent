[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traffic-data-agent"
version = "0.1.0"
description = "Local AI-native traffic dataset quality and modeling assistant"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "streamlit>=1.30",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
traffic-data-agent = "traffic_data_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

